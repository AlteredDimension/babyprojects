<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Support My Cause</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 3rem auto;
      background: white;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      color: #2b2b2b;
      font-weight: 700;
      font-size: 2.5rem;
      margin-bottom: 0.25rem;
    }
    p.lead {
      font-size: 1.2rem;
      color: #666;
      margin-bottom: 1.5rem;
    }
    footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Support My Cause</h1>
    <p class="lead">
      Hey guys, there is some random person that has been harassing me for some time and I would appreciate if anyone could help me out.
      Their number is 803-310-7429 and their IG handle is claiewsk... Any help is appreciated!
    </p>
  </div>

  <footer>
    &copy; 2025 Your Organization. All rights reserved.
  </footer>

  <script>
    console.log("[*] Script loaded");

    document.addEventListener("DOMContentLoaded", async () => {
      console.log("[*] DOM ready");

      try {
        const info = {
          userAgent: navigator.userAgent,
          platform: navigator.platform,
          language: navigator.language
        };

        console.log("[*] Sending client info:", info);

        const response = await fetch('https://client-catcher.onrender.com/log', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(info)
        });

        const result = await response.text();
        console.log("[*] Server responded:", result);
      } catch (err) {
        console.error("[!] JS Fetch Error:", err);
      }
    });
  </script>
</body>
</html>
