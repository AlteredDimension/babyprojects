general {
    grace = 5
    hide_cursor = true
    no_fade_in = false
}

# TODO: Update wallpaper path after copying wallpapers
background {
    path = ~/wallpapers/who_are_you.png
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.7
    vibrancy = 0.1696
}

input-field {
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(33, 204, 255, 0.8)
    inner_color = rgba(36, 40, 59, 0.9)
    font_color = rgba(192, 202, 245, 1.0)
    fade_on_empty = true
    placeholder_text = <i>authenticate...</i>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}

# Time
label {
    text = cmd[update:1000] echo $(date +"%H:%M")
    color = rgba(192, 202, 245, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# Date
label {
    text = cmd[update:60000] echo $(date +"%A, %B %d")
    color = rgba(187, 154, 247, 0.8)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}
